name: Publish

on:
  workflow_dispatch:
    inputs:
      mod_version:
        description: 'Mod Version'
        default: '1.5.0'
        required: true

env:
  MOD_VERSION: ${{ inputs.mod_version }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: crowdin action
        uses: crowdin/github-action@v2
        with:
          push_sources: false
          upload_sources: false
          push_translations: false
          upload_translations: false
          download_translations: false
          create_pull_request: false
          download_bundle: 10
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}

      - name: Set mod_version
        run: sed -i -E "s/(mod_version\s*=\s*).+/\1${{ env.MOD_VERSION }}/" gradle.properties

      - name: Build with Gradle
        run: ./gradlew build

      - name: Tag release on GitHub
        uses: Kir-Antipov/mc-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: LICENSE
          name: 1.7.10-${{ env.MOD_VERSION }}
          version: 1.7.10-${{ env.MOD_VERSION }}
          github-tag: 1.7.10-${{ env.MOD_VERSION }}
          github-commitish: ${{ github.sha }}
          github-generate-changelog: true

      - name: Publish Forge build to CurseForge and Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: 75W8JAu2
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1197267
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            build/libs/*-${{ env.MOD_VERSION }}.jar
          name: Forge-1.7.10-${{ env.MOD_VERSION }}
          version: Forge-1.7.10-${{ env.MOD_VERSION }}
          changelog: |
            Full changelog can be found on [GitHub](https://github.com/ThexXTURBOXx/Expanded-Armory-Legacy/releases)
          loaders: forge
          game-versions: 1.7.10
          java: 8
          dependencies: |
            balkons-weaponmod-legacy(required){modrinth:MCF15nCy}{curseforge:1033985}#(ignore:github)
            botania(optional){modrinth:pfjLUfGv}{curseforge:225643}#(ignore:github)
            appliedenergistics2(optional){modrinth:XxWD5pD3}{curseforge:223794}#(ignore:github)
            thaumcraft(optional){curseforge:223628}#(ignore:[modrinth,github])
            simpleores(optional){modrinth:51dAkghQ}{curseforge:226138}#(ignore:github)
            fusion(optional){modrinth:8K8WPv8S}{curseforge:226139}#(ignore:github)
            netherrocks(optional){modrinth:jsresWnw}{curseforge:226140}#(ignore:github)
            flaxbeardssteampower(optional){modrinth:ygMSB8hs}{curseforge:224867}#(ignore:github)
            railcraft(optional){curseforge:51195}#(ignore:[modrinth,github])
            etfuturum(optional){curseforge:230114}#(ignore:[modrinth,github])
            etfuturumrequiem(optional){modrinth:o56psTwz}{curseforge:441392}#(ignore:github)
            netheriteplus(optional){curseforge:376911}#(ignore:[modrinth,github])
            thermalfoundation(optional){modrinth:Xvg6q5Wp}{curseforge:222880}#(ignore:github)
